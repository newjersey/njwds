version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use
        - npm ci
    build:
      commands:
        - npm run grove:build
        - npm run storybook:build
  artifacts:
    baseDirectory: packages/njwds/storybook-static
    files:
      - "**/*"
  cache:
    paths:
      - node_modules
