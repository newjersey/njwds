name: QASP

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'  # Monday at 2am EST (7am UTC)
  workflow_dispatch:  # manual triggering

permissions:
  contents: read

jobs:
  qasp:
    uses: newjersey/innovation-shared-actions/.github/workflows/qasp.yml@feat/add-slack-alert-to-qasp
    secrets: inherit
    with:
      node-version: ".nvmrc" # optional (default: .nvmrc)
      deployment-check-urls: |
        https://registry.npmjs.org/@newjersey/njwds1
        https://registry.npmjs.org/@newjersey/tokens1
      system-diagram-location: ""
      command-test-coverage: "npm run test:coverage:ci"
      command-linting: "npm run lint"
      command-accessibility: "npm run test:accessibility:ci"
