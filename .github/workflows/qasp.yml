name: QASP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qasp:
    uses: newjersey/innovation-shared-actions/.github/workflows/qasp.yml@feat/qasp-shared-workflow
    secrets: inherit
    with:
      node-version: ".nvmrc" # optional (default: .nvmrc)
      deployment-check-urls: |
        https://registry.npmjs.org/@newjersey/njwds
        https://registry.npmjs.org/@newjersey/tokens
      system-diagram-location: ""
      command-test-coverage: "npm run test:coverage"
      command-linting: "npm run lint"
      command-accessibility: "npm run test:accessibility:ci"
