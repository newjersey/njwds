name: QASP

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * 1'  # Monday at 2am EST (7am UTC)
  workflow_dispatch:  # manual triggering
    inputs:
      branch:
        description: "Branch to run QASP against (default: main)"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  qasp:
    uses: newjersey/innovation-shared-actions/.github/workflows/qasp.yml@main
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.branch || 'main' }}
      node-version: ".nvmrc" # optional (default: .nvmrc)
      slack-channel: "#sandbox"
      deployment-check-urls: ""
      system-diagram-location: ""
      command-test-coverage: "npm run test:coverage:ci"
      command-linting: "npm run lint"
      command-accessibility: "npm run test:accessibility:ci"
